<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" role="img" aria-label="ertechlab logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ertechlab</title>
  <style>
    .brand-text { fill: #0B1220; }
    @media (prefers-color-scheme: dark) {
      .brand-text { fill: #F8FAFC !important; }
    }
  </style>
  <!-- Terminal-style icon: dark window with a green shell prompt -->
  <rect x="8" y="20" width="104" height="80" rx="12" fill="#0B1220" stroke="#22C55E" stroke-width="2"/>
  <circle cx="22" cy="32" r="3" fill="#EF4444"/>
  <circle cx="32" cy="32" r="3" fill="#F59E0B"/>
  <circle cx="42" cy="32" r="3" fill="#22C55E"/>
  <text x="22" y="78" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="34" font-weight="700" fill="#22C55E">&gt;_</text>
  <!-- Wordmark in monospace to match the prompt -->
  <text x="132" y="76" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="44" font-weight="700" class="brand-text" fill="#0B1220">ertech<tspan fill="#16A34A">lab</tspan></text>
</svg>
